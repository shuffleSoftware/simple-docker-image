
steps:
  - name: build-and-test
    image: woodpeckerci/plugin-docker-buildx
    settings:
      debug: true
      dry_run: true
      repo: my-image
      tags: ${CI_COMMIT_SHA}
      auto_tag: true
      build_args:
        - BUILDKIT_INLINE_CACHE=1
  - name: docker
    image: docker
    commands:
+   - echo $DOCKER_USERNAME
+   - echo $DOCKER_PASSWORD
+   secrets: [ docker_username, docker_password ]
